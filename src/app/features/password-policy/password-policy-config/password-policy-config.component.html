<div class="p-4 md:p-6 bg-slate-50 min-h-screen">
  <div class="flex flex-col gap-4 max-w-4xl mx-auto">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Password Policy Configuration</h2>
      <p class="text-slate-500 text-sm">Define global complexity rules for all user passwords.</p>
    </div>

    <p-card styleClass="shadow-md border border-slate-200">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        
        <!-- Important Notice -->
        <div class="bg-amber-50 border-l-4 border-amber-400 p-4 mb-6 rounded-r-lg">
          <div class="flex items-center gap-3">
            <i class="pi pi-exclamation-triangle text-amber-500 text-xl"></i>
            <div class="text-amber-800 text-sm">
              <span class="font-bold">Important:</span> Updating the policy will require <strong>all active users</strong> to change their passwords upon their next login.
            </div>
          </div>
        </div>

        <!-- 2-Column Grid with Aligned Inputs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
          
          <div class="field-row">
            <label for="min_length" class="aligned-label">Minimum Password Length</label>
            <p-inputNumber id="min_length" formControlName="min_length" [min]="4" [max]="32" [showButtons]="true" buttonLayout="horizontal" 
              incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus" inputStyleClass="text-center" styleClass="w-full">
            </p-inputNumber>
            <small class="text-slate-400 mt-1">Recommended: at least 8 characters.</small>
          </div>

          <div class="field-row">
            <label for="num_cnt" class="aligned-label">Required Numeric Digits</label>
            <p-inputNumber id="num_cnt" formControlName="num_cnt" [min]="0" [max]="10" [showButtons]="true" buttonLayout="horizontal" 
              incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus" inputStyleClass="text-center" styleClass="w-full">
            </p-inputNumber>
          </div>

          <div class="field-row">
            <label for="uppercase_cnt" class="aligned-label">Required Uppercase Letters</label>
            <p-inputNumber id="uppercase_cnt" formControlName="uppercase_cnt" [min]="0" [max]="10" [showButtons]="true" buttonLayout="horizontal" 
              incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus" inputStyleClass="text-center" styleClass="w-full">
            </p-inputNumber>
          </div>

          <div class="field-row">
            <label for="lowercase_cnt" class="aligned-label">Required Lowercase Letters</label>
            <p-inputNumber id="lowercase_cnt" formControlName="lowercase_cnt" [min]="0" [max]="10" [showButtons]="true" buttonLayout="horizontal" 
              incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus" inputStyleClass="text-center" styleClass="w-full">
            </p-inputNumber>
          </div>

          <div class="field-row">
            <label for="symbol_cnt" class="aligned-label">Required Symbols (e.g. @, #, $)</label>
            <p-inputNumber id="symbol_cnt" formControlName="symbol_cnt" [min]="0" [max]="10" [showButtons]="true" buttonLayout="horizontal" 
              incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus" inputStyleClass="text-center" styleClass="w-full">
            </p-inputNumber>
            <small class="text-slate-400 mt-1">Allowed symbols: ! @ # $ % ^ & * -</small>
          </div>

        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-slate-100">
          <p-button label="Discard" severity="secondary" [outlined]="true" icon="pi pi-refresh" (onClick)="loadPolicy()" [disabled]="loading"></p-button>
          <p-button label="Save Policy" icon="pi pi-check" type="submit" [loading]="loading" [disabled]="form.invalid"></p-button>
        </div>

      </form>
    </p-card>
  </div>
</div>
<p-toast></p-toast>
