<div class="history-form-container p-4 flex flex-column gap-5 bg-gray-50 min-h-full">
  
  <div class="form-body flex flex-column gap-5">
    
    <!-- 1. External Origin -->
    <p-panel styleClass="border-round-2xl shadow-1 border-none bg-white">
      <ng-template pTemplate="header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="bg-primary-alpha-10" 
               style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <i class="pi pi-building text-primary" style="font-size: 1.25rem;"></i>
          </div>
          <span class="font-bold text-color" style="font-size: 1.1rem;">External Institution Context</span>
        </div>
      </ng-template>

      <div class="panel-content">
        <div class="form-row cols-2">
            <app-text-field label="Bank Name" [field]="bankName" (onChange)="(null)" />
            <app-text-field label="Branch Name" [field]="branchName" (onChange)="(null)" />
        </div>
        <div class="form-row cols-2">
            <app-text-field label="Loan Type" [field]="loanType" (onChange)="(null)" />
        </div>
        <div class="form-row">
            <app-textarea-field label="Reason of Loan" [field]="reasonOfLoan" (onChange)="(null)" />
        </div>
      </div>
    </p-panel>

    <!-- 2. Financials & Closure -->
    <p-panel styleClass="border-round-2xl shadow-1 border-none bg-white">
      <ng-template pTemplate="header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="bg-indigo-alpha-10" 
               style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <i class="pi pi-calendar-times text-indigo-500" style="font-size: 1.25rem;"></i>
          </div>
          <span class="font-bold text-color" style="font-size: 1.1rem;">Financials & Closure</span>
        </div>
      </ng-template>

      <div class="panel-content">
        <div class="form-row cols-3">
          <app-number-field label="Sanctioned Amount (₹)" [field]="sanctionedAmount" [useGrouping]="true" (onChange)="(null)" />
          <app-date-field label="Sanctioned Date" [field]="sanctionedDate" (onChange)="(null)" />
          <app-date-field label="Account Close Date" [field]="accountCloseDate" (onChange)="(null)" />
        </div>
      </div>
    </p-panel>

  </div>

  <app-form-actions
    saveLabel="Save External History"
    [loading]="loading()"
    (save)="save()"
    (cancel)="cancel()">
  </app-form-actions>
</div>
