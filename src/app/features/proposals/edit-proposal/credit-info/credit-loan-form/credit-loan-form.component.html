<div class="loan-form-container p-4 flex flex-column gap-5 bg-gray-50 min-h-full">
  
  <div class="form-body flex flex-column gap-5">
    
    <!-- 1. Identity & Branch -->
    <p-panel styleClass="border-round-2xl shadow-1 border-none bg-white">
      <ng-template pTemplate="header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="bg-primary-alpha-10" 
               style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <i class="pi pi-info-circle text-primary" style="font-size: 1.25rem;"></i>
          </div>
          <span class="font-bold text-color" style="font-size: 1.1rem;">Identity & Branch</span>
        </div>
      </ng-template>

      <div class="panel-content">
        <div class="form-row cols-2">
          <app-select-field label="Branch Name" [field]="branchId" [options]="branches()" optionValue="value" (onChange)="(null)" />
          <app-text-field label="Account Number" [field]="accountNo" (onChange)="(null)" />
        </div>
        <div class="form-row cols-2">
          <app-select-field label="Loan Type" [field]="loanTypeId" [options]="loanTypes()" optionValue="value" (onChange)="(null)" />
          <app-date-field label="Disbursement Date" [field]="disbursementDate" (onChange)="(null)" />
        </div>
      </div>
    </p-panel>

    <!-- 2. Financial Figures -->
    <p-panel styleClass="border-round-2xl shadow-1 border-none bg-white">
      <ng-template pTemplate="header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="bg-indigo-alpha-10" 
               style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <i class="pi pi-chart-line text-indigo-500" style="font-size: 1.25rem;"></i>
          </div>
          <span class="font-bold text-color" style="font-size: 1.1rem;">Financial Figures</span>
        </div>
      </ng-template>

      <div class="panel-content">
        <div class="form-row cols-3">
          <app-number-field label="Sanctioned Amount (₹)" [field]="sanctionedAmount" [useGrouping]="true" (onChange)="(null)" />
          <app-number-field label="Amount Paid (₹)" [field]="amountPaid" [useGrouping]="true" (onChange)="(null)" />
          <app-number-field label="Installment Amount (₹)" [field]="installmentAmount" [useGrouping]="true" (onChange)="(null)" />
        </div>
        <div class="form-row cols-3">
          <app-number-field label="Loan Outstanding (₹)" [field]="loanOutstanding" [useGrouping]="true" (onChange)="(null)" />
          <app-number-field label="Loan Overdue (₹)" [field]="loanOverdueAmount" [useGrouping]="true" (onChange)="(null)" />
          <app-date-field label="Due / Maturity Date" [field]="dueMaturityDate" (onChange)="(null)" />
        </div>
      </div>
    </p-panel>

    <!-- 3. Repayment & Collateral -->
    <p-panel styleClass="border-round-2xl shadow-1 border-none bg-white">
      <ng-template pTemplate="header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="bg-green-alpha-10" 
               style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <i class="pi pi-check-circle text-green-500" style="font-size: 1.25rem;"></i>
          </div>
          <span class="font-bold text-color" style="font-size: 1.1rem;">Repayment & Status</span>
        </div>
      </ng-template>

      <div class="panel-content">
        <div class="form-row cols-3">
          <app-select-field label="Timely Repay?" [field]="isTimelyRepayment" [options]="repaymentOptions" optionValue="value" (onChange)="(null)" />
          <app-select-field label="Going to Repay?" [field]="willRepayLoan" [options]="repaymentOptions" optionValue="value" (onChange)="(null)" />
          <app-select-field label="Reported to CIBIL?" [field]="reportedToCibil" [options]="repaymentOptions" optionValue="value" (onChange)="(null)" />
        </div>
        <div class="form-row">
          <app-textarea-field label="Mortgage Details & Price" [field]="mortgageDetails" [rows]="2" (onChange)="(null)" />
        </div>
        <div class="form-row">
          <app-textarea-field label="Details of Excess Collateral" [field]="excessCollateralDetails" [rows]="2" (onChange)="(null)" />
        </div>
      </div>
    </p-panel>

  </div>

  <app-form-actions
    saveLabel="Save Loan Details"
    [loading]="loading()"
    (save)="save()"
    (cancel)="cancel()">
  </app-form-actions>
</div>
