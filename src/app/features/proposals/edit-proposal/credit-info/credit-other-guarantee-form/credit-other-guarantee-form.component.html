<div class="loan-form-container p-4 flex flex-column gap-5 bg-gray-50 min-h-full">
  
  <div class="form-body flex flex-column gap-5">
    
    <!-- 1. Institution Type -->
    <p-panel styleClass="border-round-2xl shadow-1 border-none bg-white">
      <ng-template pTemplate="header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="bg-primary-alpha-10" 
               style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <i class="pi pi-building text-primary" style="font-size: 1.25rem;"></i>
          </div>
          <span class="font-bold text-color" style="font-size: 1.1rem;">External Institution</span>
        </div>
      </ng-template>

      <div class="panel-content">
        <div class="form-row">
            <div class="flex flex-column gap-2 mb-3">
                <label class="font-semibold text-color">Applicant have guarantee in Co-Operative bank/Society Or Nationalised Bank</label>
                <p-selectButton 
                    [options]="bankCategoryOptions" 
                    [(ngModel)]="bankCategory" 
                    optionLabel="label" 
                    optionValue="value"
                    styleClass="w-full text-sm">
                </p-selectButton>
            </div>
        </div>
        <div class="form-row">
            <app-checkbox-field label="Are you a member of this society?" [field]="isSocietyMember" (onChange)="(null)" />
        </div>
      </div>
    </p-panel>

    <!-- 2. Borrower & Identity -->
    <p-panel styleClass="border-round-2xl shadow-1 border-none bg-white">
      <ng-template pTemplate="header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="bg-blue-alpha-10" 
               style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <i class="pi pi-user-edit text-blue-500" style="font-size: 1.25rem;"></i>
          </div>
          <span class="font-bold text-color" style="font-size: 1.1rem;">Details & Identity</span>
        </div>
      </ng-template>

      <div class="panel-content">
        <div class="form-row">
            <app-text-field label="Borrower Name" [field]="borrowerName" (onChange)="(null)" />
        </div>
        <div class="form-row cols-2">
            <app-text-field label="Bank or Institute Name" [field]="bankInstituteName" (onChange)="(null)" />
            <app-text-field label="Branch Name" [field]="branchName" (onChange)="(null)" />
        </div>
        <div class="form-row cols-2">
          <app-text-field label="Account Number" [field]="accountNo" (onChange)="(null)" />
          <app-text-field label="Loan Type" [field]="loanType" (onChange)="(null)" />
        </div>
      </div>
    </p-panel>

    <!-- 3. Financial Figures -->
    <p-panel styleClass="border-round-2xl shadow-1 border-none bg-white">
      <ng-template pTemplate="header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="bg-indigo-alpha-10" 
               style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <i class="pi pi-chart-line text-indigo-500" style="font-size: 1.25rem;"></i>
          </div>
          <span class="font-bold text-color" style="font-size: 1.1rem;">Financial Totals</span>
        </div>
      </ng-template>

      <div class="panel-content">
        <div class="form-row cols-3">
          <app-number-field label="Sanctioned Amount (₹)" [field]="sanctionedAmount" [useGrouping]="true" (onChange)="(null)" />
          <app-number-field label="Loan Outstanding (₹)" [field]="loanOutstanding" [useGrouping]="true" (onChange)="(null)" />
          <app-number-field label="Loan Overdue (₹)" [field]="loanOverdueAmount" [useGrouping]="true" (onChange)="(null)" />
        </div>
        <div class="form-row cols-2">
            <app-date-field label="Due / Maturity Date" [field]="dueMaturityDate" (onChange)="(null)" />
            <app-select-field label="Timely Repay?" [field]="isTimelyRepayment" [options]="repaymentOptions" optionValue="value" (onChange)="(null)" />
        </div>
      </div>
    </p-panel>

  </div>

  <app-form-actions
    saveLabel="Save External Guarantee"
    [loading]="loading()"
    (save)="save()"
    (cancel)="cancel()">
  </app-form-actions>
</div>
