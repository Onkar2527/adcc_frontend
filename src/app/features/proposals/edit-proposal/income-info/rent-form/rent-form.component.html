<div class="rent-form-container p-4">

  <!-- ROW 1: Lease Details & Financials -->
  <div class="section-row">

    <!-- Lease & Property Details -->
    <div class="section-col">
      <p-panel styleClass="border-round-xl border-none h-full">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-indigo-alpha-10" style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-file-pdf text-indigo-600" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color" style="font-size: 1.1rem;">Lease & Property Details</span>
          </div>
        </ng-template>

        <div class="panel-content">
          <div class="form-row cols-2">
            <app-text-field label="Rented To (Name/Entity)" [field]="rentedToName" />
            <app-text-field label="Property / Shop Number" [field]="propertyNo" />
          </div>
          <div class="form-row">
            <app-checkbox-field label="Registered Agreement?" [field]="hasAgreement" />
          </div>
          @if (hasAgreement()) {
            <div class="form-row cols-2">
              <app-text-field label="Agreement Term" [field]="agreementTerm" />
              <app-date-field label="Lease Expiry Date" [field]="leaseExpiryDate" />
            </div>
          }
          <div class="form-row">
            <app-checkbox-field label="Enable Rent Discounting Scheme?" [field]="isRentDiscountingScheme" />
          </div>
          <div class="form-row">
            <app-textarea-field label="Remarks / Details" [field]="remark" [rows]="3" />
          </div>
        </div>
      </p-panel>
    </div>

    <!-- Rental Financials -->
    <div class="section-col">
      <p-panel styleClass="border-round-xl border-none h-full surface-card border-left-3 border-primary">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-blue-alpha-10" style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-percentage text-blue-500" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color" style="font-size: 1.1rem;">Rental Financials</span>
          </div>
        </ng-template>

        <div class="panel-content">
          <div class="form-row">
            <app-number-field label="Monthly Rent (Basic) (₹)" [field]="monthlyRentAmount" mode="currency" currency="INR" />
          </div>
          <div class="form-row">
            <app-number-field label="GST Amount (₹)" [field]="gstAmount" mode="currency" currency="INR" />
          </div>
          <div class="form-row">
            <app-number-field label="TDS Deduction (₹)" [field]="tdsAmount" mode="currency" currency="INR" />
          </div>
          <div class="form-row mt-2">
            <div class="p-3 border-round-xl bg-primary-reverse-alpha-5 surface-100 flex justify-content-between align-items-center w-full">
              <span class="font-semibold text-color-secondary">Net Monthly Rent:</span>
              <span class="text-xl font-bold text-primary">{{ netRentReceived() | currency:'INR' }}</span>
            </div>
          </div>
        </div>
      </p-panel>
    </div>

  </div>

</div>
