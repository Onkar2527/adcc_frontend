<div class="loan-info-container p-4">
  
  <div class="section-row">
    
    <!-- Panel 1: Loan Parameters -->
    <div class="section-col">
      <p-panel styleClass="border-round-2xl shadow-2 border-none h-full">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-primary-alpha-10" style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-money-bill text-primary" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color" style="font-size: 1.1rem;">Loan Parameters</span>
          </div>
        </ng-template>

        <div class="panel-content">
          <div class="form-row">
            <app-select-field label="Loan Type" [field]="loanType" [options]="loanTypeOptions()" optionValue="value" (onChange)="onFieldChange()" />
          </div>

          <div class="form-row">
            <app-number-field label="Requested Amount (₹)" [field]="requestedAmount" [required]="true" [useGrouping]="true" (onChange)="onFieldChange()" />
          </div>

          <div class="form-row fade-in">
            <app-text-field label="Requested Amount in Words" [field]="requestedAmountWords" [disabled]="true" (onChange)="onFieldChange()" />
          </div>

          <!-- Moratorium & Insurance -->
          <div class="form-row cols-2" style="margin-top: 10px;">
            <app-checkbox-field label="Moratorium" [field]="hasMoratorium" (onChange)="onFieldChange()" />
            <app-checkbox-field label="Insurance Premium" [field]="hasInsurance" (onChange)="onFieldChange()" />
          </div>

          @if (hasMoratorium()) {
            <div class="form-row fade-in">
              <app-number-field label="Moratorium Period (Months)" [field]="moratoriumPeriod" [min]="0" (onChange)="onFieldChange()" />
            </div>
          }

          @if (hasInsurance()) {
            <div class="form-row fade-in">
              <app-number-field label="Insurance Premium Amount (₹)" [field]="insuranceAmount" [useGrouping]="true" (onChange)="onFieldChange()" />
            </div>
          }

          <div class="form-row" style="flex: 1;">
            <app-textarea-field label="Reason of Loan" [field]="reasonOfLoan" [rows]="4" [autoResize]="false" (onChange)="onFieldChange()" />
          </div>
        </div>
      </p-panel>
    </div>

    <!-- Panel 2: Repayment Details -->
    <div class="section-col">
      <p-panel styleClass="border-round-2xl shadow-2 border-none h-full surface-card border-left-3 border-primary">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-green-alpha-10" style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-calendar-plus text-green-500" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color" style="font-size: 1.1rem;">Repayment Schedule</span>
          </div>
        </ng-template>

        <div class="panel-content">
          <div class="form-row">
            <app-select-field label="Type of Installment" [field]="installmentType" [options]="installmentTypeOptions" optionValue="value" (onChange)="onFieldChange()" />
          </div>

          <div class="form-row cols-2">
            <app-number-field label="Duration (Months)" [field]="durationMonths" [min]="1" (onChange)="onFieldChange()" />
            <app-number-field label="Interest Rate (%)" [field]="interestRate" [min]="0" (onChange)="onFieldChange()" />
          </div>

          <div class="form-row">
            <app-number-field label="Monthly Installment (₹)" [field]="monthlyInstallment" [useGrouping]="true" [disabled]="true" (onChange)="onFieldChange()" />
          </div>

          <div class="form-row mt-3">
             <div class="p-3 border-round-xl bg-primary-reverse-alpha-5 surface-100 flex justify-content-between align-items-center">
                <span class="font-semibold text-color-secondary">Total Requested Amount:</span>
                <span class="text-xl font-bold text-primary">{{ totalRequestedAmount() | currency:'INR' }}</span>
             </div>
          </div>

        </div>
      </p-panel>
    </div>

  </div>

  <!-- Row 2: Participation Loan Scheme -->
  <div class="section-row mt-4">
    <div class="section-col" style="flex: 1;">
      <p-panel styleClass="border-round-2xl shadow-2 border-none surface-card overflow-hidden">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="bg-blue-alpha-10" style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                <i class="pi pi-users text-blue-500" style="font-size: 1.25rem;"></i>
              </div>
              <span class="font-bold text-color" style="font-size: 1.1rem;">Participation Loan Scheme Details</span>
            </div>
            <app-checkbox-field label="Is Participation Loan?" [field]="isParticipationLoan" (onChange)="onFieldChange()" />
          </div>
        </ng-template>

        @if (isParticipationLoan()) {
          <div class="p-2 fade-in">
            <div class="table-container shadow-1 overflow-hidden">
              <p-table [value]="participationDetails()" styleClass="p-datatable-sm custom-table" [scrollable]="true" scrollDirection="horizontal">
                <ng-template pTemplate="header">
                  <tr>
                    <th style="width: 200px">Bank Name</th>
                    <th style="width: 120px">Role</th>
                    <th style="width: 150px">Loan Type</th>
                    <th style="width: 140px">Sanctioned (₹)</th>
                    <th style="width: 140px">Outstanding (₹)</th>
                    <th style="width: 100px">Share %</th>
                    <th style="width: 50px"></th>
                  </tr>
                </ng-template>
              <ng-template pTemplate="body" let-row let-i="rowIndex">
                <tr>
                  <td><input type="text" pInputText [(ngModel)]="row.bank_name" class="w-full p-inputtext-sm" (change)="onFieldChange()" /></td>
                  <td><input type="text" pInputText [(ngModel)]="row.role" class="w-full p-inputtext-sm" (change)="onFieldChange()" /></td>
                  <td>
                    <p-select 
                      [(ngModel)]="row.loan_type" 
                      [options]="loanTypeOptions()" 
                      optionLabel="label" 
                      optionValue="value" 
                      placeholder="Select Type" 
                      appendTo="body"
                      styleClass="w-full"
                      class="w-full"
                      (onModelChange)="onFieldChange()">
                    </p-select>
                  </td>
                  <td>
                    <p-inputNumber [(ngModel)]="row.sanctioned_amount" [useGrouping]="true" inputId="sanctioned-{{i}}" class="w-full" styleClass="w-full" (onModelChange)="onFieldChange()" />
                  </td>
                  <td>
                    <p-inputNumber [(ngModel)]="row.outstanding_amount" [useGrouping]="true" inputId="outstanding-{{i}}" class="w-full" styleClass="w-full" (onModelChange)="onFieldChange()" />
                  </td>
                  <td>
                    <p-inputNumber [(ngModel)]="row.share_percent" [min]="0" [max]="100" suffix="%" inputId="share-{{i}}" class="w-full" styleClass="w-full" (onModelChange)="onFieldChange()" />
                  </td>
                  <td class="text-center">
                    <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="removeParticipationRow(i)"></button>
                  </td>
                </tr>
              </ng-template>
              </p-table>
            </div>
            <div class="p-2">
               <button pButton label="Add Bank Row" icon="pi pi-plus" class="p-button-text p-button-sm" (click)="addParticipationRow()"></button>
            </div>
          </div>
        }
      </p-panel>
    </div>

  </div>

</div>
