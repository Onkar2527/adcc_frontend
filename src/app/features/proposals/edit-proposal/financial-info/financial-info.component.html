<div class="financial-container p-4">
  
  <div class="section-row">
    <!-- ── PANEL 1: Bank Details ── -->
    <div class="section-col" style="flex: 1;">
      <p-panel styleClass="border-round-xl border-none h-full shadow-sm border-1 surface-border">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-primary-alpha-10" style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-building text-primary" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color uppercase" style="letter-spacing: 0.05em; font-size: 0.9rem;">Bank Details</span>
          </div>
        </ng-template>
        <div class="panel-content">
          <div class="form-row cols-2">
            <app-text-field label="Bank Name" [field]="bankName" (onChange)="onFieldChange()" />
            <app-text-field label="Account Number" [field]="accountNumber" (onChange)="onFieldChange()" />
          </div>
        </div>
      </p-panel>
    </div>

    <!-- ── PANEL 2: Shares & Investments ── -->
    <div class="section-col" style="flex: 1;">
      <p-panel styleClass="border-round-xl border-none h-full shadow-sm border-1 surface-border">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-teal-alpha-10" style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-chart-pie text-teal-600" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color uppercase" style="letter-spacing: 0.05em; font-size: 0.9rem;">Shares & Investments</span>
          </div>
        </ng-template>
        <div class="panel-content">
          <div class="form-row">
            <app-checkbox-field label="Includes shares and investments in private companies?" [field]="hasInvestments" (onChange)="onFieldChange()" />
          </div>
          @if (hasInvestments()) {
            <div class="conditional-block">
              <app-textarea-field label="Investment Details" [field]="investmentDetails" [rows]="2" (onChange)="onFieldChange()" />
            </div>
          }
        </div>
      </p-panel>
    </div>
  </div>

  <div class="section-row">
    <!-- ── PANEL 3: Income Tax Returns ── -->
    <div class="section-col" style="flex: 1;">
      <p-panel styleClass="border-round-xl border-none h-full shadow-sm border-1 surface-border">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-green-alpha-10" style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-file-excel text-green-600" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color uppercase" style="letter-spacing: 0.05em; font-size: 0.9rem;">Income Tax Returns</span>
          </div>
        </ng-template>
        <div class="panel-content">
          <div class="form-row">
            <app-checkbox-field label="Is the income tax Return filed?" [field]="isItrFiled" (onChange)="onFieldChange()" />
          </div>
          @if (isItrFiled()) {
            <div class="conditional-block">
              <div class="form-row cols-2">
                <app-select-field label="Financial Year" [field]="itrFinancialYear" [options]="financialYearOptions" optionValue="value" (onChange)="onFieldChange()" />
                <app-number-field label="Amount of income as per return" [field]="itrIncomeAmount" (onChange)="onFieldChange()" />
              </div>
              <div class="form-row mt-3">
                <app-number-field label="Income tax amount" [field]="itrTaxAmount" (onChange)="onFieldChange()" />
              </div>
            </div>
          }
        </div>
      </p-panel>
    </div>

    <!-- ── PANEL 4: Property Taxes ── -->
    <div class="section-col" style="flex: 1;">
      <p-panel styleClass="border-round-xl border-none h-full shadow-sm border-1 surface-border">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-orange-alpha-10" style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-home text-orange-600" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color uppercase" style="letter-spacing: 0.05em; font-size: 0.9rem;">Property Taxes</span>
          </div>
        </ng-template>
        <div class="panel-content">
          <div class="form-row">
            <app-checkbox-field label="Do you pay property taxes?" [field]="paysPropertyTax" (onChange)="onFieldChange()" />
          </div>
          @if (paysPropertyTax()) {
            <div class="conditional-block">
              <div class="form-row cols-2">
                <app-number-field label="Wealth Amount" [field]="wealthAmount" (onChange)="onFieldChange()" />
                <app-number-field label="Tax amount" [field]="propertyTaxAmount" (onChange)="onFieldChange()" />
              </div>
              <div class="form-row mt-3">
                <app-select-field label="What year was the last assessment?" [field]="lastAssessmentYear" [options]="assessmentYearOptions" optionValue="value" (onChange)="onFieldChange()" />
              </div>
            </div>
          }
        </div>
      </p-panel>
    </div>
  </div>

  <div class="section-row">
    <!-- ── PANEL 5: CIBIL Information ── -->
    <div class="section-col" style="min-width: 100%;">
      <p-panel styleClass="border-round-xl border-none h-full shadow-sm border-1 surface-border">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-purple-alpha-10" style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-id-card text-purple-600" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color uppercase" style="letter-spacing: 0.05em; font-size: 0.9rem;">CIBIL Status</span>
          </div>
        </ng-template>
        <div class="panel-content">
          <div class="form-row">
            <app-checkbox-field label="Is there a cibil?" [field]="hasCibil" (onChange)="onFieldChange()" />
          </div>
      
          @if (hasCibil()) {
            <div class="conditional-block">
              <div class="form-row cols-3">
                <app-text-field label="Cibil Type" [field]="cibilType" (onChange)="onFieldChange()" />
                <app-date-field label="Cibil Date" [field]="cibilDate" (onChange)="onFieldChange()" />
                <app-text-field label="CMR" [field]="cibilCmr" (onChange)="onFieldChange()" />
              </div>
              <div class="form-row mt-3">
                <app-textarea-field label="Cibil Details" [field]="cibilDetails" [rows]="2" (onChange)="onFieldChange()" />
              </div>
            </div>
          }
        </div>
      </p-panel>
    </div>
  </div>

</div>
