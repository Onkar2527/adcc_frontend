<div class="bank-scheme-container p-4">

  <div class="section-row">

    <!-- Panel 1: Regulatory Classification -->
    <div class="section-col">
      <p-panel styleClass="border-round-2xl shadow-2 border-none h-full surface-card">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-orange-alpha-10"
              style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-chart-bar text-orange-500" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color" style="font-size: 1.1rem;">Regulatory Classification</span>
          </div>
        </ng-template>

        <div class="panel-content">
          <div class="form-row">
            <app-select-field label="Bank loan scheme type" [field]="bankLoanSchemeType" [options]="loanTypeOptions()"
              optionValue="value" (onChange)="onFieldChange()" />
          </div>

          <div class="form-row">
            <app-select-field label="Industry Marking" [field]="industryMarking" [options]="industryOptions"
              optionValue="value" (onChange)="onFieldChange()" />
          </div>

          <div class="form-row">
            <app-select-field label="Priority Sector Marking" [field]="prioritySectorMarking"
              [options]="prioritySectorOptions" optionValue="value" (onChange)="onFieldChange()" />
          </div>

          <div class="form-row">
            <app-select-field label="Weaker Sector" [field]="weakerSector" [options]="weakerSectorOptions"
              optionValue="value" (onChange)="onFieldChange()" />
          </div>
        </div>
      </p-panel>
    </div>

    <!-- Panel 2: MIS Sector Codes -->
    <div class="section-col">
      <p-panel styleClass="border-round-2xl shadow-2 border-none h-full surface-card border-left-3 border-blue-500">
        <ng-template pTemplate="header">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="bg-blue-alpha-10"
              style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
              <i class="pi pi-tag text-blue-500" style="font-size: 1.25rem;"></i>
            </div>
            <span class="font-bold text-color" style="font-size: 1.1rem;">MIS Sector Codes</span>
          </div>
        </ng-template>

        <div class="panel-content">
          <div class="form-row">
            <app-select-field label="Real Estate Marking" [field]="realEstateMarking"
              [options]="realEstateMarkingOptions" optionValue="value" (onChange)="onFieldChange()" />
          </div>

          <div class="form-row cols-2">
            <app-text-field label="Priority Code" [field]="priorityCode" (onChange)="onFieldChange()" />
            <app-text-field label="Weaker Code" [field]="weakerCode" (onChange)="onFieldChange()" />
          </div>

          <div class="form-row">
            <app-text-field label="Real Estate Code" [field]="realEstateCode" (onChange)="onFieldChange()" />
          </div>


        </div>
      </p-panel>
    </div>

  </div>

</div>
