<div class="audit-mode-switch" aria-label="Audit type">
  <button
    type="button"
    [class.active]="auditMode() === 'regular'"
    (click)="selectMode('regular')"
  >
    Internal Audits
    <span>{{ regularRows().length }}</span>
  </button>

  <button
    type="button"
    [class.active]="auditMode() === 'special'"
    (click)="selectMode('special')"
  >
    Special Audits
    <span>{{ specialRows().length }}</span>
  </button>
</div>

<app-audit-unit-dashboard
  [eyebrow]="dashboardEyebrow()"
  [title]="dashboardTitle()"
  [subtitle]="dashboardSubtitle()"
  [panelTitle]="panelTitle()"
  [units]="filteredData()"
  [loading]="loading()"
  [search]="search()"
  [selectedStatus]="selectedStatus()"
  [statusOptions]="statusOptions"
  [totalUnits]="modeRows().length"
  [totalAuditPending]="totalAuditPending()"
  [totalReviewPending]="totalReviewPending()"
  [totalCompliancePending]="totalCompliancePending()"
  [totalCompleted]="totalCompleted()"
  (searchChange)="search.set($event)"
  (selectedStatusChange)="selectedStatus.set($event)"
  (refresh)="loadData()"
  (openUnit)="openAssessment($event)"
></app-audit-unit-dashboard>
