<p-toast></p-toast>

<div class="login-page">
  <!-- Fixed Banner -->
  <div class="top-banner"></div>

  <!-- Scrollable Content -->
  <div class="content-section">
    <!-- Brand -->
    <div class="brand-section">
      <h1>AuditPro</h1>
      <p>RISK BASED INTERNAL AUDIT</p>
    </div>

    <!-- Login -->
    <div class="login-wrapper">
      <div class="login-card">
        <h2>Login to Your Account</h2>

        <div class="company-name">Kredpool Co-Op Bank Ltd., Sangli</div>

        <div class="divider"></div>

        <p class="login-text">Login to start your session!</p>

        <form #loginForm="ngForm" (ngSubmit)="onLogin()" autocomplete="off">
          <!-- Username -->
          <div class="input-group">
            <label for="username">Employee Code</label>

            <input
              id="username"
              pInputText
              type="text"
              [(ngModel)]="username"
              name="username"
              placeholder="Enter Employee Code"
              class="w-full custom-input"
              required
              autocomplete="username"
            />
          </div>

          <!-- Password -->
          <div class="input-group">
            <label for="password">Password</label>

            <p-password
              inputId="password"
              [(ngModel)]="password"
              name="password"
              [toggleMask]="true"
              [feedback]="false"
              placeholder="Enter Password"
              styleClass="w-full"
              inputStyleClass="w-full custom-input"
              autocomplete="current-password"
              required
            >
            </p-password>
          </div>

          <!-- Login Button -->
          <button
            pButton
            type="submit"
            [label]="loading() ? 'Logging in...' : 'Login'"
            [loading]="loading()"
            [disabled]="loading() || !username || !password"
            class="login-btn"
          ></button>

          <!-- Roles -->
          <div class="user-types">
            <button
              type="button"
              class="user-btn"
              [class.active]="selectedRole === 'auditor'"
              [disabled]="loading()"
              (click)="setCredentials('auditor')"
            >
              Auditor
            </button>

            <button
              type="button"
              class="user-btn"
              [class.active]="selectedRole === 'reviewer'"
              [disabled]="loading()"
              (click)="setCredentials('reviewer')"
            >
              Reviewer
            </button>

            <button
              type="button"
              class="user-btn"
              [class.active]="selectedRole === 'manager'"
              [disabled]="loading()"
              (click)="setCredentials('manager')"
            >
              Employee
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
