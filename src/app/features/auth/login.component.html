<p-toast></p-toast>

<div class="login-page">
  <!-- Fixed Banner -->
  <div class="top-banner">
    <div class="glow-node node-1"></div>
    <div class="glow-node node-2"></div>
    <div class="glow-node node-3"></div>
  </div>

  <!-- Background Floating Shapes in White Space -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <!-- Scrollable Content -->
  <div class="content-section">
    <!-- Brand -->
    <div class="brand-section animate-item">
      <h1>AssurePro</h1>
      <p>RISK BASED INTERNAL AUDIT</p>
    </div>

    <!-- Login -->
    <div class="login-wrapper">
      <div class="login-card animate-item delay-1">
        <!-- Dynamic Heading -->
        <h2 *ngIf="!showOtpScreen">Login to Your Account</h2>
        <h2 *ngIf="showOtpScreen">Two-Factor Verification</h2>

        <div class="company-name">{{ bankName }}</div>

        <div class="divider"></div>

        <!-- Login Screen -->
        <div *ngIf="!showOtpScreen">
          <p class="login-text">Login to start your session!</p>

          <form #loginForm="ngForm" (ngSubmit)="onLogin()" autocomplete="off">
            <!-- Username -->
            <div class="input-group animate-item delay-2">
              <label for="username">Employee Code</label>
              <div class="input-icon-wrapper">
                <i class="pi pi-user input-icon"></i>
                <input id="username" pInputText type="text" [(ngModel)]="username" name="username"
                  placeholder="Enter Employee Code" class="w-full custom-input icon-indent" required
                  autocomplete="username" />
              </div>
            </div>

            <!-- Password -->
            <div class="input-group animate-item delay-3">
              <label for="password">Password</label>
              <div class="input-icon-wrapper">
                <i class="pi pi-lock input-icon"></i>
                <p-password inputId="password" [(ngModel)]="password" name="password" [toggleMask]="true"
                  [feedback]="false" placeholder="Enter Password" styleClass="w-full"
                  inputStyleClass="w-full custom-input icon-indent" autocomplete="current-password" required>
                </p-password>
              </div>
            </div>

            <!-- Forgot Password Link -->
            <div class="reset-link-container animate-item delay-3"
              style="text-align: right; margin-bottom: 12px; margin-top: -6px;">
              <a href="javascript:void(0)" (click)="goToForgotPassword()" class="reset-pass-link"
                style="font-size: 0.85rem; color: #3f51b5; text-decoration: none; font-weight: 600;">Forgot/Reset
                Password?</a>
            </div>

            <!-- Login Button -->
            <button pButton type="submit" [loading]="loading()" [disabled]="loading() || !username || !password"
              class="login-btn animate-item delay-4">
              {{ loading() ? 'Logging in...' : 'Login' }}
            </button>

            <!-- Language Selector -->
            <div class="login-language-selector animate-item delay-4" style="margin-top: 15px;">
              <div class="segmented-control">
                <input type="radio" id="lang-en" name="lang" value="en" [(ngModel)]="selectedLanguage"
                  (change)="onLanguageChange('en')" />
                <label for="lang-en">English</label>

                <input type="radio" id="lang-mr" name="lang" value="mr" [(ngModel)]="selectedLanguage"
                  (change)="onLanguageChange('mr')" />
                <label for="lang-mr">मराठी</label>
              </div>
            </div>

            Roles
            <div class="user-types animate-item delay-5">
              <button type="button" class="user-btn" [class.active]="selectedRole === 'auditor'" [disabled]="loading()"
                (click)="setCredentials('auditor')">
                Auditor
              </button>

              <button type="button" class="user-btn" [class.active]="selectedRole === 'reviewer'" [disabled]="loading()"
                (click)="setCredentials('reviewer')">
                Reviewer
              </button>

              <button type="button" class="user-btn" [class.active]="selectedRole === 'manager'" [disabled]="loading()"
                (click)="setCredentials('manager')">
                Employee
              </button>
            </div>
          </form>
        </div>

        <div *ngIf="showOtpScreen" class="animate-item">
          <p class="login-text">
            A 6-digit verification code has been sent to your registered email address:
            <strong>{{ maskedEmail }}</strong>
          </p>

          <form #otpForm="ngForm" (ngSubmit)="onVerifyOtp()" autocomplete="off">
            <!-- OTP Code -->
            <div class="input-group animate-item delay-2">
              <label for="otpCode">Verification Code</label>
              <div class="input-icon-wrapper">
                <i class="pi pi-shield input-icon"></i>
                <input id="otpCode" pInputText type="text" [(ngModel)]="otpCode" name="otpCode"
                  placeholder="Enter 6-digit OTP" class="w-full custom-input icon-indent" required maxlength="6"
                  pattern="[0-9]{6}" autocomplete="one-time-code" />
              </div>
            </div>

            <!-- OTP Buttons -->
            <div class="reset-actions-container animate-item delay-3">
              <button type="button" class="cancel-btn" [disabled]="loadingOtp()" (click)="cancelOtp()">
                Cancel
              </button>
              <button pButton type="submit" [loading]="loadingOtp()"
                [disabled]="loadingOtp() || !otpCode || otpCode.length !== 6" class="login-btn">
                {{ loadingOtp() ? 'Verifying...' : 'Verify' }}
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
